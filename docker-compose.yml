services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # A fresh container (always the case in CI, and the first `docker compose up`
      # locally) copies template DB files before it can accept connections, which
      # can take a few minutes — generous timeout/retries avoid a false "unhealthy"
      # before that finishes. `docker compose up --wait` treats "unhealthy" as
      # terminal, not "keep waiting", so this must outlast startup, not just react to it.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # appsettings.Local.json never reaches this container (excluded by
    # backend/.dockerignore, same as it's excluded from git) — every T1.2 Options class
    # this needs at startup (Jwt, Auth, Authentication:Google, MailSettings,
    # PaymobSettings, HangfireSettings, Storage) comes from .env instead.
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Korner;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      ConnectionStrings__HangfireConnection: "Server=sqlserver,1433;Database=KornerJobs;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
    ports:
      - "5080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8080
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  sqlserver-data:
